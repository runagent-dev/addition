name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: [self-hosted, Linux, X64, runagent-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Everything runs in one pinned image: the runner has no C toolchain, mounts
      # /tmp noexec, and its Docker daemon may not see the workspace path.
      - name: check
        run: |
          git archive HEAD | docker run -i --rm golang:1.27.4 sh -euc '
            mkdir /src && cd /src && tar -x
            unformatted="$(gofmt -l .)"
            if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
            go vet ./...
            go test ./...
            go test -race ./...
            CGO_ENABLED=0 go build ./cmd/addn
          '
