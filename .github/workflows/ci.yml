name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: [self-hosted, Linux, X64, runagent-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      # The runner has no C toolchain, so the race detector runs in the golang image.
      - name: test (race)
        run: docker run --rm -v "$PWD":/src -w /src golang:1.27 go test -race ./...
      - name: build
        run: CGO_ENABLED=0 go build ./cmd/addn
