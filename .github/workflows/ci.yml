name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Everything runs in one pinned image, fed with git archive, so the toolchain never depends on the runner.
      - name: check
        shell: bash
        run: |
          git archive HEAD | docker run -i --rm golang:1.27.4@sha256:205c7636d74e0ffbe3d007162df7d74f859f5a8c8322dfb9f907977686c126cf sh -euc '
            mkdir /src && cd /src && tar -x
            unformatted="$(gofmt -l .)"
            if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
            go vet ./...
            go test ./...
            go test -race ./...
            CGO_ENABLED=0 go build ./cmd/addition
          '
      # A broken release config or installer must fail here, not on the first tag.
      - name: release config and installer
        shell: bash
        run: |
          tar -c . | docker run -i --rm --entrypoint sh \
            goreleaser/goreleaser:v2.20.3@sha256:3019e0e61c99808e42ce60c9cf77f7882685ffd2bd09d18ef6da8f9c9810e71c -euc '
            mkdir /src && cd /src && tar -x
            git config --global --add safe.directory /src
            goreleaser check
            goreleaser release --snapshot --clean --skip=publish
            mkdir /smoke && tar -xzf dist/addition_linux_amd64.tar.gz -C /smoke
            /smoke/addition version | grep -q "\"commit\":\"[0-9a-f]\{40\}\""
          '
          docker run -i --rm koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb -s sh - < install.sh
