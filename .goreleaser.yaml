version: 2

project_name: addition

builds:
  - id: addition
    main: ./cmd/addition
    binary: addition
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/runagent-dev/addition/internal/cli.Version={{ .Version }}
      - -X github.com/runagent-dev/addition/internal/cli.Commit={{ .FullCommit }}
      - -X github.com/runagent-dev/addition/internal/cli.Date={{ .CommitDate }}

# Version-less names keep releases/latest/download/<asset> stable for install.sh.
archives:
  - id: addition
    ids: [addition]
    name_template: "addition_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Publishing is done by .github/workflows/release.yml from the attested files; goreleaser only builds.
release:
  disable: true

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 2
  filters:
    exclude:
      - '^(docs|chore|test|ci|build|style)(\(.+\))?!?:'
      - '^Merge '
