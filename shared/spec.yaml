# Addition — public API contract
#
# Authoritative for both language tracks. The shipped library version
# (ts/package.json, python/pyproject.toml) MUST match `version` below.
# CLAUDE.md §6 invariant #9 requires all three to move together.
#
# Keep this file narrow: it pins the public surface, not implementation
# details. For full architectural context see docs/spec.md.

version: "0.1.0"

# Constructor for the `Addition` main class. See M12.
constructor:
  name: "Addition"
  params:
    databaseUrl: { type: string, required: true }
    encryptionKey:
      type: string
      required: true
      description: "64 hex chars (32 bytes) — AES-256-GCM key"
    callbackUrl:
      type: string
      required: true
      description: "Fully-qualified URL the developer's app serves the OAuth callback handler at"
    tokenRefreshIntervalMs: { type: number, required: false, default: 60000 }
    tokenRefreshBufferMs:   { type: number, required: false, default: 300000 }

methods:

  # --- Provider configuration (M12) ---
  configureProvider:
    params:
      providerId:   { type: string, required: true }
      clientId:     { type: string, required: true }
      clientSecret: { type: string, required: true }
      scopes:       { type: "string[]", required: false }
      extraConfig:  { type: object, required: false }
    returns: void
    notes: "Idempotent; encrypts client_secret before storing."

  listConfiguredProviders:
    params: {}
    returns: "ProviderConfig[]"

  # --- OAuth flows (M8) ---
  getAuthUrl:
    params:
      userId:         { type: string, required: true }
      providerId:     { type: string, required: true }
      scopes:         { type: "string[]", required: false }
      redirectAfter:  { type: string, required: false }
      metadata:       { type: object, required: false }
    returns: string

  handleCallback:
    params:
      query: { type: "Record<string,string>", required: true }
    returns: CallbackResult

  # --- Connection management (M12) ---
  listConnections:
    params:
      userId:     { type: string, required: true }
      providerId: { type: string, required: false }
      status:     { type: string, required: false }
    returns: "Connection[]"

  getConnection:
    params:
      connectionId: { type: string, required: true }
    returns: "Connection | null"

  revokeConnection:
    params:
      connectionId: { type: string, required: true }
    returns: void

  # --- Authenticated proxy (M10) ---
  proxy:
    params:
      userId:       { type: string, required: true }
      providerId:   { type: string, required: true }
      method:       { type: string, required: true }
      path:         { type: string, required: true }
      body:         { type: any, required: false }
      params:       { type: object, required: false }
      headers:      { type: object, required: false }
      connectionId: { type: string, required: false }
    returns: ProxyResponse

  # --- Tools (M3, M7) ---
  getToolDefinitions:
    params:
      providerId: { type: string, required: true }
    returns: "ToolDefinition[]"

  getToolDefinition:
    params:
      providerId: { type: string, required: true }
      toolId:     { type: string, required: true }
    returns: "ToolDefinition | null"

  executeTool:
    params:
      userId:       { type: string, required: true }
      providerId:   { type: string, required: true }
      toolId:       { type: string, required: true }
      params:       { type: object, required: true }
      connectionId: { type: string, required: false }
    returns: ToolExecutionResult

  listToolkits:
    params: {}
    returns: "ToolkitSummary[]"

  # --- Lifecycle (M11, M12) ---
  startBackgroundTasks: { params: {}, returns: void }
  stopBackgroundTasks:  { params: {}, returns: void }
  shutdown:             { params: {}, returns: void }

  # --- Events (M12) ---
  on:
    params:
      event:   { type: string,   required: true }
      handler: { type: function, required: true }
    returns: void
    notes: >
      Events: connection.created, connection.revoked, token.refreshed,
      token.refresh_failed, tool.executed, tool.error.

# Error shapes that both implementations must surface verbatim.
errors:
  - AdditionError             # base
  - EncryptionError
  - SchemaError
  - ProviderNotFoundError
  - ToolNotFoundError
  - ToolValidationError
  - OAuthError
  - ConnectionNotFoundError   # M10
  - ConnectionExpiredError    # M10

# Error-string contract for CallbackResult.error (M8):
callback_error_codes:
  - invalid_state             # state unknown or expired
  - access_denied             # provider surfaced this in the callback query
  - invalid_grant             # token exchange returned a 4xx with this code
  - invalid_code              # Slack "ok:false" error
  - malformed_token_response  # engine couldn't extract access_token
