id: "github"
name: "GitHub"
auth_type: "api_key"   # what `addition connect github` does; the oauth2 block below is the other way in

api_key:
  create_url: "https://github.com/settings/tokens"
  instructions:
    - "Choose Generate new token; a fine-grained token limits access to the repositories you pick."
    - "Grant only the access your agent needs, set an expiry, and generate it."
    - "Copy the token: GitHub shows it only once."
  env_var: "GITHUB_TOKEN"
  identity:
    path: "/user"
    field: "login"
    subject_field: "id"

oauth2:
  authorize_url: "https://github.com/login/oauth/authorize"
  token_url: "https://github.com/login/oauth/access_token"
  revoke_url: null
  refresh_supported: false
  pkce_supported: false
  pkce_required: false
  default_scopes:
    - "repo"
    - "read:user"
    - "user:email"
  scopes_delimiter: "space"
  authorize_params: {}
  token_params: {}
  token_response_format: "json"
  client_auth_method: "body"

api:
  base_url: "https://api.github.com"
  allowed_hosts:
    - "api.github.com"
  auth_header: "Authorization"
  auth_prefix: "Bearer"
  probe_path: "/user"
  rate_limit:
    requests_per_second: 5
    retry_after_header: "Retry-After"

quirks:
  - "Token exchange requires Accept: application/json header"
  - "Returns HTTP 200 with error in body instead of 4xx on failure"
  - "Tokens do not expire by default; no refresh token flow"
  - "Rate limit info in X-RateLimit-Remaining and X-RateLimit-Reset headers"
