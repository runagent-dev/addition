id: "google-calendar"
name: "Google Calendar"
auth_type: "oauth2"
extends: "google"

oauth2:
  default_scopes:
    - "openid"
    - "https://www.googleapis.com/auth/userinfo.email"
    - "https://www.googleapis.com/auth/calendar"
    - "https://www.googleapis.com/auth/calendar.events"

api:
  base_url: "https://www.googleapis.com"
  allowed_hosts:
    - "www.googleapis.com"
    - "openidconnect.googleapis.com"
  allowed_path_prefixes:
    - "/calendar/"
  service: "calendar-json.googleapis.com"
  probe_path: "/calendar/v3/users/me/calendarList?maxResults=1"

quirks:
  - "Inherits Google OAuth and its client; see google.yaml"
  - "Paths start with /calendar/v3 and resolve against the host of base_url"
  - "Per-user rate limit: 500 requests per 100 seconds per user"
