id: "google-drive"
name: "Google Drive"
auth_type: "oauth2"
extends: "google"

oauth2:
  default_scopes:
    - "openid"
    - "https://www.googleapis.com/auth/userinfo.email"
    - "https://www.googleapis.com/auth/drive"

api:
  base_url: "https://www.googleapis.com"
  allowed_hosts:
    - "www.googleapis.com"
    - "drive.googleapis.com"
    - "openidconnect.googleapis.com"
  allowed_path_prefixes:
    - "/drive/"
    - "/upload/drive/"
    - "/download/drive/"

quirks:
  - "Inherits Google OAuth and its client; see google.yaml"
  - "File metadata lives under /drive/v3; uploads use the separate /upload/drive/v3 path"
  - "Responses include only id, name, mimeType and kind unless `fields` asks for more"
