# Provider config template. Copy this file to <provider-id>.yaml and fill in.
# See docs/spec.md §6 for the full field reference.

id: ""                              # Unique ID (lowercase, hyphenated)
name: ""                            # Human-readable display name
auth_type: "oauth2"                 # "oauth2" | "api_key" | "basic"

# Uncomment to inherit from a base provider (e.g. "google"). Scalars override,
# arrays replace, nested maps merge; the top of the chain owns accounts and OAuth.
# extends: ""

oauth2:
  authorize_url: ""
  token_url: ""
  revoke_url: null                  # Optional
  refresh_supported: true
  pkce_supported: true
  pkce_required: false
  default_scopes: []
  scopes_delimiter: "space"         # "space" (standard) or "comma" (Slack)
  authorize_params: {}              # Extra params on authorize URL
  token_params: {}                  # Extra params on token exchange
  token_response_format: "json"     # "json" or "form"
  client_auth_method: "body"        # "body" or "header" (Basic auth)

  # For non-standard token response structures (like Slack). Dot-paths.
  token_response_mapping:
    access_token: "access_token"
    refresh_token: "refresh_token"
    expires_in: "expires_in"

  # Optional. After connecting, GET url with the new token. subject_field (dot-path) is the stable
  # account id an alias is bound to; field is shown to the user, e.g. an email.
  identity:
    url: ""
    field: ""
    subject_field: ""

api:
  base_url: ""
  # allowed_hosts: ["api.example.com"]  # Optional: hosts the token may be sent to; default is base_url's host
  # allowed_path_prefixes: ["/v1/"]    # Optional: a request path must start with one; set it when apps share a host
  auth_header: "Authorization"
  auth_prefix: "Bearer"
  rate_limit:
    requests_per_second: 10
    retry_after_header: "Retry-After"

quirks: []                          # Human-readable notes
