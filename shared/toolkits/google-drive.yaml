provider: "google-drive"
command: "drive"
name: "Google Drive"
description: "Search, organise and inspect files and folders in Google Drive"

tools:

  - id: list_files
    name: "List files"
    description: "List or search files and folders in the user's My Drive and files shared with them; shared drives are not included. Use q to filter and fields to choose which metadata comes back."
    operation: "GET /drive/v3/files"
    effect: read
    params:
      - name: q
        type: string
        required: false
        description: "Drive search query (e.g., \"name contains 'report'\", \"'<folderId>' in parents and trashed = false\", \"mimeType = 'application/vnd.google-apps.folder'\")"
      - name: pageSize
        type: integer
        required: false
        default: 100
        description: "Maximum number of files per page (1-1000)"
      - name: fields
        type: string
        required: false
        description: "Partial response selector (e.g., 'nextPageToken, files(id, name, mimeType, parents, modifiedTime, size)'); include nextPageToken when paginating, or Drive omits the cursor and listing stops after one page"
    pagination:
      type: cursor
      cursor_param: pageToken
      cursor_response_field: nextPageToken
    response:
      type: object
      fields:
        files: "Array of file metadata objects"
        nextPageToken: "Token for the next page, absent on the last page"
        incompleteSearch: "True when not every corpus could be searched"

  - id: get_file
    name: "Get file metadata"
    description: "Get metadata for one file or folder by ID. Does not download content."
    operation: "GET /drive/v3/files/{fileId}"
    effect: read
    params:
      - name: fileId
        type: string
        required: true
        description: "The ID of the file or folder"
      - name: fields
        type: string
        required: false
        description: "Partial response selector (e.g., 'id, name, mimeType, parents, size, webViewLink'); use '*' for every field"
    response:
      type: object
      fields:
        id: "File ID"
        name: "File name"
        mimeType: "MIME type; folders are application/vnd.google-apps.folder"
        parents: "IDs of parent folders (requires fields)"
        webViewLink: "Link to open the file in a browser (requires fields)"

  - id: create_folder
    name: "Create folder"
    description: "Create a new folder, optionally inside a parent folder"
    operation: "POST /drive/v3/files"
    effect: write
    transform: "google-drive:create_folder_body"
    params:
      - name: name
        type: string
        required: true
        description: "Folder name"
      - name: parent
        type: string
        required: false
        description: "ID of the parent folder; defaults to My Drive root"
    response:
      type: object
      fields:
        id: "ID of the created folder"
        name: "Folder name"
        mimeType: "application/vnd.google-apps.folder"

  - id: update_file
    name: "Rename or move file"
    description: "Rename a file or folder, or move it from one parent folder to another"
    operation: "PATCH /drive/v3/files/{fileId}"
    effect: write
    transform: "google-drive:update_file_request"
    params:
      - name: fileId
        type: string
        required: true
        description: "The ID of the file or folder to update"
      - name: name
        type: string
        required: false
        description: "New name"
      - name: addParents
        type: string
        required: false
        description: "ID of the single folder to move the file into (move destination)"
      - name: removeParents
        type: string
        required: false
        description: "ID of the single folder to move the file out of (move source)"
    response:
      type: object
      fields:
        id: "File ID"
        name: "File name after the update"

  - id: trash_file
    name: "Trash file"
    description: "Move a file or folder to the trash. Drive deletes trashed items permanently after 30 days."
    operation: "PATCH /drive/v3/files/{fileId}"
    effect: destructive
    transform: "google-drive:trash_file_body"
    params:
      - name: fileId
        type: string
        required: true
        description: "The ID of the file or folder to trash"
    response:
      type: object
      fields:
        id: "File ID"
        name: "File name"
