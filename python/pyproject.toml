[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runagent-addition"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "testcontainers[postgres]>=4",
    "freezegun>=1.4",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["runagent_addition"]
